<hr class="rule"><div class="body" id="body">사각형 모양의 성 모서리마다 보초막을 지어 남녀노소 구분 없이 보초를 섰던 곳이다. 높이 1.5m의 원추형으로 지어졌으며, 각 모서리 사이의 성벽 중앙에도 4개의 초소를 만들었다. 특히 정문초소는 주민들의 성밖 출입 시 양민증이나 통행증을 검사 하는 곳이었으며, 야간에는 통행금지였다.</div>

<script>const data={"ko": {"title": "경찰지서", "sub": "Police Substation", "asian": "警察驻在所 | 警察駐在所", "body": "사각형 모양의 성 모서리마다 보초막을 지어 남녀노소 구분 없이 보초를 섰던 곳이다. 높이 1.5m의 원추형으로 지어졌으며, 각 모서리 사이의 성벽 중앙에도 4개의 초소를 만들었다. 특히 정문초소는 주민들의 성밖 출입 시 양민증이나 통행증을 검사 하는 곳이었으며, 야간에는 통행금지였다."}, "en": {"title": "Police Substation", "sub": "경찰지서", "asian": "警察驻在所 | 警察駐在所", "body": "Guard posts were built at each corner of the rectangular fortress, where residents stood guard regardless of age or gender. Each post was built in a conical shape approximately 1.5 meters high, and four additional guard posts were installed at the center of the fortress walls between the corners. The main gate guard post, in particular, was where residents’ civilian identification cards or travel passes were inspected when they entered or left the fortress. Passage was prohibited at night."}, "zh": {"title": "警察駐在所", "sub": "Police Substation", "asian": "경찰지서", "body": "在长方形城墙的各个角落都建有岗哨，居民不分男女老少都要轮流站岗。岗哨呈圆锥形，高约1.5米，在各角之间的城墙中央还设置了4处岗哨。尤其是正门岗哨，居民进出城外时要在这里接受良民证或通行证检查，夜间则禁止通行。"}, "ja": {"title": "警察驻在所", "sub": "Police Substation", "asian": "경찰지서", "body": "長方形の城壁の各角には見張り小屋が設けられ、老若男女を問わず住民が見張りに立った。高さ約1.5mの円錐形に造られ、各角の間にある城壁の中央にも4か所の哨所が設けられた。特に正門哨所では、住民が城外へ出入りする際に良民証や通行証の検査が行われ、夜間は通行禁止であった。"}};
