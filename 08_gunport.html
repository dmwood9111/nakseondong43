onst data={"ko": {"title": "총안", "sub": "Gun Port", "asian": "射击孔 | 銃眼", "body": "성벽의 2m 높이에 총안을 만들어 무기를 겨누거나 바깥쪽을 내다볼 수 있게 하였다. 이 총안은 사람의 키보다 높은 곳에 있었기 때문에 계단으로 올라가야 했다. 총안을 통한 경비는 특공대로 편성된 남자들이 담당하였는데, 각 성벽마다 2개씩 모두 8개가 있었다."}, "en": {"title": "Gun Port", "sub": "총안", "asian": "射击孔 | 銃眼", "body": "Gun ports were installed at a height of about 2 meters in the fortress wall, allowing guards to aim weapons or look outside. Because the openings were higher than a person’s height, guards had to climb stairs to reach them. Guard duty at the gun ports was carried out by men organized into special units. There were two gun ports on each fortress wall, eight in total."}, "zh": {"title": "射击孔", "sub": "Gun Port", "asian": "총안", "body": "城墙约2米高处设有射击孔，可用于瞄准武器或观察城外。由于射击孔高于人的身高，必须通过台阶登上去才能使用。通过射击孔执行警戒任务的，是编入特攻队的男性。每面城墙各设2处，共有8处射击孔。"}, "ja": {"title": "銃眼", "sub": "Gun Port", "asian": "총안", "body": "城壁の高さ約2mの位置には銃眼が設けられ、武器を構えたり外を見渡したりできるようになっていた。銃眼は人の背丈より高い位置にあったため、階段を上って使用した。銃眼での警備は特攻隊として編成された男性たちが担当し、各城壁に2か所ずつ、合計8か所設けられていた。"}};const ui={"ko": {"home": "목록", "toc": "목록", "site": "낙선동 4·3성(城)", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "제주특별자치도 · 낙선동 4·3성"}, "en": {"home": "List", "toc": "List", "site": "Nakseon-dong 4·3 Fortress", "siteSub": "Jeju 4·3 Historical Site", "footer": "Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"}, "zh": {"home": "目录", "toc": "目录", "site": "乐善洞 4·3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "济州特别自治道 · 乐善洞 4·3城"}, "ja": {"home": "一覧", "toc": "一覧", "site": "楽善洞4・3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "済州特別自治道 · 楽善洞4・3城"}};const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所", "ja": "警察駐在所"}, "sentry": {"ko": "보초대기소", "en": "Sentry Station", "zh": "哨兵待机所", "ja": "歩哨待機所"}, "tower": {"ko": "경비망루", "en": "Watchtower", "zh": "警戒瞭望台", "ja": "警備望楼"}, "gunport": {"ko": "총안", "en": "Gun Port", "zh": "射击孔", "ja": "銃眼"}};const prevSlug="tower";const nextSlug=null;function setLang(lang){document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=data[lang],u=ui[lang];title.textContent=d.title;sub.textContent=d.sub;asian.textContent=d.asian;body.textContent=d.body;siteName.textContent=u.site;siteSub.textContent=u.siteSub;homeBtn.textContent=u.home;tocBtn.textContent=u.toc;footerText.textContent=u.footer;const p=document.getElementById('prevBtn'),n=document.getElementById('nextBtn');if(p)p.textContent='← '+names[prevSlug][lang];if(n)n.textContent=names[nextSlug][lang]+' →'}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');</script></body></html>
