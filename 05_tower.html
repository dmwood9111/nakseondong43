<hr class="rule"><div class="body" id="body">사각형 모양의 성 모서리마다 2층 구조의 경비망루를 지어 남녀노소 구분 없이 보초를 섰다. 하룻밤에 5명씩 배치되어 1명씩 교대로 경비를 섰는데, 낮에 힘든 밭일을 마치고 서는 야간 경비는 쏟아져 오는 졸음과의 힘겨운 싸움이었다.</div>
