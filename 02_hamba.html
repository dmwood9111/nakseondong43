<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>함바집 | 낙선동 4·3성</title><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;background:#ececec;color:#262626}.shell{max-width:520px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 28px rgba(0,0,0,.12)}header{height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e6e6;background:#fff;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:16px;letter-spacing:-.4px;min-width:0;overflow-wrap:anywhere}.brand small{display:block;font-size:10px;font-weight:500;color:#777;margin-top:3px}.home{font-size:13px;text-decoration:none;color:#333;border:1px solid #ddd;border-radius:9px;padding:9px 11px}main{padding:38px 28px 48px}.eyebrow{font-size:12px;color:#777;letter-spacing:.08em;margin-bottom:12px}h1{font-size:36px;line-height:1.15;letter-spacing:-1.7px;margin:0;overflow-wrap:anywhere;word-break:normal}.en{font-size:19px;margin-top:9px;overflow-wrap:anywhere;word-break:normal}.asian{font-size:14px;color:#555;margin-top:7px;overflow-wrap:anywhere;word-break:normal}.rule{border:0;border-top:1px solid #bdbdbd;margin:24px 0}.body{font-size:16px;line-height:1.95;word-break:normal;overflow-wrap:anywhere;white-space:pre-line;max-width:100%}.langs{display:flex;gap:6px;margin:28px 0 0;flex-wrap:wrap}.langs button{border:1px solid #ddd;background:#fff;padding:9px 12px;border-radius:9px;font-size:12px;cursor:pointer}.langs .active{background:#283846;color:white;border-color:#283846}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:42px;padding-top:20px;border-top:1px solid #eee;gap:8px}.nav a{text-decoration:none;color:#555;font-size:12px;min-width:0;overflow-wrap:anywhere;word-break:normal}.nav a:last-child{text-align:right}.nav .list{border:1px solid #ddd;border-radius:9px;padding:9px 12px;color:#222}footer{padding:24px 28px;background:#f4f4f2;border-top:1px solid #e7e7e4;font-size:11px;color:#777;text-align:center}.restore{margin-top:24px;padding:16px 18px;background:#f4f4f2;border-left:3px solid #283846;font-size:13px;line-height:1.7}.section-title{font-size:13px;letter-spacing:.08em;color:#777;margin:42px 0 12px}.contents{padding:0}.item{display:block;text-decoration:none;color:#222;padding:18px 16px;border-bottom:1px solid #e7e7e7;position:relative}.item:first-child{border-top:1px solid #e7e7e7}.num{font-size:11px;color:#888;margin-bottom:5px}.item strong{font-size:19px;letter-spacing:-.4px;overflow-wrap:anywhere;word-break:normal}.item .sub{font-size:12px;color:#777;margin-top:4px;padding-right:24px;overflow-wrap:anywhere;word-break:normal}.arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:#aaa}@media(max-width:420px){header{padding:0 18px}main{padding:30px 20px 40px}h1{font-size:32px}.nav{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.langs button{padding:9px 10px}.restore{overflow-wrap:anywhere;word-break:normal}}html[lang="zh-CN"] .body,html[lang="ja"] .body,html[lang="zh-CN"] h1,html[lang="ja"] h1,html[lang="zh-CN"] .item,html[lang="ja"] .item{word-break:break-all;overflow-wrap:anywhere}</style></head><body><div class="shell"><header><div class="brand"><span id="siteName"></span><small id="siteSub"></small></div><a id="homeBtn" class="home" href="index.html"></a></header><main><div class="eyebrow">02 / 08</div><h1 id="title"></h1><div class="en" id="sub"></div><div class="asian" id="asian"></div><div class="langs"><button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="zh">中文</button><button data-l="ja">日本語</button></div><hr class="rule"><div class="body" id="body"></div><div class="nav"><a id="prevBtn" href="01_rampart.html"></a><a id="tocBtn" class="list" href="index.html"></a><a id="nextBtn" href="03_gate.html"></a></div></main><footer id="footerText"></footer></div><script>const data={"ko": {"title": "함바집", "sub": "Poverty house", "asian": "临时棚屋 | 仮設住居", "body": "함바집은 원래 ‘건설 현장에서 식당으로 이용 되는 임시 건물’을 뜻하는 일본어이지만, 4·3 당시에는 마을이 불탄 뒤 임시로 지은 여러 형태의 가건물을 의미했다.\n\n선흘리에서는 1949년 4월 낙선동 4·3성이 완공 되자 주민들이 겨우 잠만 잘 수 있는 함바집을 짓고 집단생활을 시작했다. 당시 함바집은 돌담을 길게 쌓은 뒤 군데군데 나무기둥을 세우고, 지붕에 새(띠풀)를 덮어 만들었다. 함바집 한 동마다 다섯 세대가 살았다. 방, 마루, 부엌의 구분이 없었고, 몸을 굽혀 출입해야 했다. 이곳에서 선흘리 주민 250세대는 5년간 온갖 고초를 겪으며 살았다."}, "en": {"title": "Hamba House", "sub": "Temporary Dwelling", "asian": "临时棚屋 | 仮設住居", "body": "The term “hamba house” originally came from Japanese and referred to a temporary building used as a dining hall at a construction site. During the Jeju 4·3 period, however, it came to mean various types of temporary dwellings built after villages had been burned down.\n\nIn Seonheul-ri, after the Nakseon-dong 4·3 Fortress was completed in April 1949, residents built hamba houses barely large enough for sleeping and began communal life. These structures were made by building long stone walls, placing wooden posts at intervals, and covering the roofs with thatch grass. Five households lived in each hamba house. There were no separate rooms, wooden floors, or kitchens, and residents had to bend down to enter. About 250 households from Seonheul-ri lived here for five years, enduring severe hardship."}, "zh": {"title": "临时棚屋（Hamba）", "sub": "Hamba House", "asian": "함바집 | 仮設住居", "body": "“Hamba屋”一词原本来自日语，指“建筑工地上作为食堂使用的临时建筑”。但在济州4·3时期，它指的是村庄被焚毁后临时搭建的各种简易住居。\n\n在善屹里，1949年4月乐善洞4·3城完工后，居民搭建了仅够睡觉的Hamba棚屋，开始集体生活。当时的棚屋先砌起长长的石墙，再间隔竖立木柱，并在屋顶覆盖茅草。每栋棚屋住着5户人家，内部没有房间、木地板和厨房之分，进出时还必须弯下身体。善屹里约250户居民在这里生活了5年，经历了种种艰辛。"}, "ja": {"title": "ハンバジプ（仮設住居）", "sub": "Hamba House", "asian": "함바집 | 临时棚屋", "body": "「ハンバジプ」は本来、「建設現場で食堂として使われる仮設建物」を意味する日本語に由来する言葉だが、済州4・3当時には、村が焼かれた後に一時的に建てられたさまざまな仮設住居を指した。\n\n善屹里では、1949年4月に楽善洞4・3城が完成すると、住民たちはようやく寝ることができる程度のハンバジプを建て、集団生活を始めた。当時のハンバジプは、石垣を長く積み、その間に木柱を立て、屋根に茅をかぶせて造られた。1棟に5世帯が暮らし、部屋・板の間・台所の区別もなく、身をかがめて出入りしなければならなかった。善屹里の住民250世帯はここで5年間、さまざまな苦難に耐えながら生活した。"}};const ui={"ko": {"home": "목록", "toc": "목록", "site": "낙선동 4·3성(城)", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "제주특별자치도 · 낙선동 4·3성"}, "en": {"home": "List", "toc": "List", "site": "Nakseon-dong 4·3 Fortress", "siteSub": "Jeju 4·3 Historical Site", "footer": "Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"}, "zh": {"home": "目录", "toc": "目录", "site": "乐善洞 4·3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "济州特别自治道 · 乐善洞 4·3城"}, "ja": {"home": "一覧", "toc": "一覧", "site": "楽善洞4・3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "済州特別自治道 · 楽善洞4・3城"}};const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所", "ja": "警察駐在所"}, "sentry": {"ko": "보초대기소", "en": "Sentry Station", "zh": "哨兵待机所", "ja": "歩哨待機所"}, "tower": {"ko": "경비망루", "en": "Watchtower", "zh": "警戒瞭望台", "ja": "警備望楼"}, "gunport": {"ko": "총안", "en": "Gun Port", "zh": "射击孔", "ja": "銃眼"}};const prevSlug="rampart";const nextSlug="gate";function setLang(lang){document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=data[lang],u=ui[lang];title.textContent=d.title;sub.textContent=d.sub;asian.textContent=d.asian;body.textContent=d.body;siteName.textContent=u.site;siteSub.textContent=u.siteSub;homeBtn.textContent=u.home;tocBtn.textContent=u.toc;footerText.textContent=u.footer;const p=document.getElementById('prevBtn'),n=document.getElementById('nextBtn');if(p)p.textContent='← '+names[prevSlug][lang];if(n)n.textContent=names[nextSlug][lang]+' →'}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');</script></body></html>
