<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통시 | 낙선동 4·3성</title><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;background:#ececec;color:#262626}.shell{max-width:520px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 28px rgba(0,0,0,.12)}header{height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e6e6;background:#fff;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:16px;letter-spacing:-.4px}.brand small{display:block;font-size:10px;font-weight:500;color:#777;margin-top:3px}.home{font-size:13px;text-decoration:none;color:#333;border:1px solid #ddd;border-radius:9px;padding:9px 11px}main{padding:38px 28px 48px}.eyebrow{font-size:12px;color:#777;letter-spacing:.08em;margin-bottom:12px}h1{font-size:36px;line-height:1.15;letter-spacing:-1.7px;margin:0}.en{font-size:19px;margin-top:9px}.asian{font-size:14px;color:#555;margin-top:7px}.rule{border:0;border-top:1px solid #bdbdbd;margin:24px 0}.body{font-size:16px;line-height:1.95;word-break:keep-all;white-space:pre-line}.langs{display:flex;gap:6px;margin:28px 0 0;flex-wrap:wrap}.langs button{border:1px solid #ddd;background:#fff;padding:9px 12px;border-radius:9px;font-size:12px;cursor:pointer}.langs .active{background:#283846;color:white;border-color:#283846}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:42px;padding-top:20px;border-top:1px solid #eee;gap:8px}.nav a{text-decoration:none;color:#555;font-size:12px}.nav a:last-child{text-align:right}.nav .list{border:1px solid #ddd;border-radius:9px;padding:9px 12px;color:#222}footer{padding:24px 28px;background:#f4f4f2;border-top:1px solid #e7e7e4;font-size:11px;color:#777;text-align:center}.restore{margin-top:24px;padding:16px 18px;background:#f4f4f2;border-left:3px solid #283846;font-size:1 appeared. Some better-off households also raised pigs here."}, "zh": {"title": "通西（传统厕所）", "sub": "Tongsi (Traditional Toilet)", "asian": "통시", "body": "沿着城墙大约建有15处“通西”（济州传统厕所）。人们依着城墙砌成半圆形石墙，并放置两块踏脚石，供人进入后蹲坐使用。由于厕所数量不足，每逢下雨时经常发生污物溢出的情况，浓重的气味也始终难以散去。一些生活较宽裕的家庭还会在这里养猪。"}, "ja": {"title": "トンシ（伝統式便所）", "sub": "Tongsi (Traditional Toilet)", "asian": "통시", "body": "城壁に沿って造られた「トンシ（済州の伝統式便所）」は15か所ほどあった。城壁に半円形に石を積み、人が中に入って用を足せるよう2つの踏み石を置いた。便所の数が足りなかったため、雨が降るとあふれることが多く、強い臭いが消えることはなかった。比較的余裕のある家では、ここで豚を飼うこともあった。"}};const ui={"ko": {"home": "목록", "toc": "목차", "site": "낙선동 4·3성(城)", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "제주특별자치도 · 낙선동 4·3성"}, "en": {"home": "List", "toc": "Contents", "site": "Nakseon-dong 4·3 Fortress", "siteSub": "Jeju 4·3 Historical Site", "footer": "Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"}, "zh": {"home": "目录", "toc": "目录", "site": "乐善洞 4·3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "济州特别自治道 · 乐善洞 4·3城"}, "ja": {"home": "一覧", "toc": "目次", "site": "楽善洞4・3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "済州特別自治道 · 楽善洞4・3城"}};const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所", "ja": "警察駐在所"}, "sentry": {"ko": "보초대기소", "en": "Sentry Station", "zh": "哨兵待机所", "ja": "歩哨待機所"}, "tower": {"ko": "경비망루", "en": "Watchtower", "zh": "警戒瞭望台", "ja": "警備望楼"}, "gunport": {"ko": "총안", "en": "Gun Port", "zh": "射击孔", "ja": "銃眼"}};const prevSlug="gate";const nextSlug="police";function setLang(lang){document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=data[lang],u=ui[lang];title.textContent=d.title;sub.textContent=d.sub;asian.textContent=d.asian;body.textContent=d.body;siteName.textContent=u.site;siteSub.textContent=u.siteSub;homeBtn.textContent=u.home;tocBtn.textContent=u.toc;footerText.textContent=u.footer;const p=document.getElementById('prevBtn'),n=document.getElementById('nextBtn');if(p)p.textContent='← '+names[prevSlug][lang];if(n)n.textContent=names[nextSlug][lang]+' →'}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');</script></body></html>
