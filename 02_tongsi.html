<main><div class="eyebrow">02 / 06</div><h1 id="title">통시</h1><div class="en" id="sub">Tongsi (Traditional Toilet)</div><div class="asian" id="asian">トンシ(伝統式便所) | 通西(传统厕所)</div>

<hr class="rule"><div class="body" id="body">통시는 성담에 붙여 만든 것이 15개 정도 있었다. 성담에 반원 모양으로 돌을 쌓아 사람이 들어가 앉을 수 있게 두 개의 디딤돌을 놓으면 되었다. 화장실이 모자라 비가 올 때면 넘치기 일쑤였으며, 심한 냄새는 늘 가시지 않았다. 여유 있는 집은 이곳에서 돼지를 키우기도 했다.</div>
<div class="nav"><a id="prevBtn" href="01_gate.html">← 정문초소</a><a id="tocBtn" class="list" href="index.html">목차</a><a id="nextBtn" href="03_police.html">경찰지서 →</a></div></main><footer id="footerText">제주특별자치도 · 낙선동 4·3성</footer></div>
<script>const data={"ko": {"title": "통시", "sub": "Tongsi (Traditional Toilet)", "asian": "トンシ(伝統式便所) | 通西(传统厕所)", "body": "통시는 성담에 붙여 만든 것이 15개 정도 있었다. 성담에 반원 모양으로 돌을 쌓아 사람이 들어가 앉을 수 있게 두 개의 디딤돌을 놓으면 되었다. 화장실이 모자라 비가 올 때면 넘치기 일쑤였으며, 심한 냄새는 늘 가시지 않았다. 여유 있는 집은 이곳에서 돼지를 키우기도 했다."}, "en": {"title": "Tongsi (Traditional Toilet)", "sub": "통시", "asian": "トンシ(伝統式便所) | 通西(传统厕所)", "body": "There were about 15 tongsi, traditional toilets, built against the fortress wall. A semicircular stone enclosure was constructed along the wall, with two stepping stones placed inside so that a person could enter and sit. Because there were not enough toilets, they frequently overflowed when it rained, and the strong odor never fully disappeared. Some better-off households also raised pigs here."}, "zh": {"title": "通西(传统厕所)", "sub": "Tongsi (Traditional Toilet)", "asian": "통시", "body": "沿着城墙大约建有15处“通西”（济州传统厕所）。人们依着城墙砌成半圆形石墙，并放置两块踏脚石，供人进入后蹲坐使用。由于厕所数量不足，每逢下雨时经常发生污物溢出的情况，浓重的气味也始终难以散去。一些生活较宽裕的家庭还会在这里养猪。"}, "ja": {"title": "トンシ(伝統式便所)", "sub": "Tongsi (Traditional Toilet)", "asian": "통시", "body": "城壁に沿って造られた「トンシ（済州の伝統式便所）」は15か所ほどあった。城壁に半円形に石を積み、人が中に入って用を足せるよう2つの踏み石を置いた。便所の数が足りなかったため、雨が降るとあふれることが多く、強い臭いが消えることはなかった。比較的余裕のある家では、ここで豚を飼うこともあった。"}};
