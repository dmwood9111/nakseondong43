  <script>
   const ui={"ko":{"home":"목록","toc":"목록","site":"낙선동 4·3성(城)","siteSub":"Nakseon-dong 4·3 Fortress","footer":"제주특별자치도 · 낙선동 4·3성"},"en":{"home":"List","toc":"List","site":"Nakseon-dong 4·3 Fortress","siteSub":"Jeju 4·3 Historical Site","footer":"Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"},"zh":{"home":"目录","toc":"目录","site":"乐善洞 4·3城","siteSub":"Nakseon-dong 4·3 Fortress","footer":"济州特别自治道 · 乐善洞 4·3城"},"ja":{"home":"一覧","toc":"一覧","site":"楽仙洞4・3城","siteSub":"Nakseon-dong 4·3 Fortress","footer":"済州特別自治道 · 楽仙洞4・3城"}}; const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所", "ja": "警察駐在所"}, "sentry": {"ko": "보초대기소", "en": "Sentry Station", "zh": "哨兵待机所", "ja": "歩哨待機所"}, "tower": {"ko": "경비망루", "en": "Watchtower", "zh": "警戒瞭望台", "ja": "警備望楼"}, "gunport": {"ko": "총안", "en": "Gun Port", "zh": "射击孔", "ja": "銃眼"}}; const main={"ko":{"title":"낙선동 4·3성(城)","sub":"Nakseon-dong 4·3 Fortress","body":"제주4.3사건이 한창이던 1948년 11월부터 중산간 마을들이 토벌군에 의해 초토화되었다. 이곳 선흘리도 11월21일 마을이 전소되어 수많은 인명희생과 재산피해를 입었다. 주민들은 1949년 봄 당국의 재건명령에 의해 길이 약 500m의 사각형 모양의 성(城)을 쌓고서야 고향에 돌아올 수 있었다.\n\n당시 제주도 전역에 쌓았던 성은 무장대습격 차단이라는 명분과 함께 주민들을 효율적으로 통제하기 위한 수단이 되었다. 성 안에서의 집단생활 또한 힘들었다. 주거지는 허름하고 좁은 가건물(함바집)이 전부였다. 또 낮에는 밭에 나가 일을 하고 밤에는 보초를 서야 했다. 특히 젊은 남자들이 대거 희생되어 성을 지키는 일은 부녀자와 노인들의 몫이었다. 이제 이곳 낙선동에 4·3의 폐허를 딛고 재건의 토대로 삼았던 전략촌성의 일부를 복원하여 역사 교육의 장으로 삼고자 한다.","restore":"복원 내역 : 성곽 292m, 가건물(함바)-1동, 초소·막-5동, 지서-1동, 화장실(통시)-4동","section":"시설 안내"},"en":{"title":"Nakseon-dong 4·3 Fortress","sub":"낙선동 4·3성(城)","body":"From November 1948, at the height of the Jeju 4·3 Incident, villages in the mid-mountain areas were devastated by government suppression forces. Seonheul-ri was also burned down on November 21, causing numerous casualties and extensive property damage. Residents were able to return to their hometown only after building a rectangular fortress approximately 500 meters in perimeter in the spring of 1949 under an official reconstruction order.\n\nFortresses built throughout Jeju at the time were intended not only to block attacks by armed groups but also to monitor and control residents efficiently. Communal life inside the fortress was extremely difficult. The only housing consisted of crude, cramped temporary structures known as hamba houses. Residents worked in the fields during the day and stood guard at night. With many young men already killed, women and elderly residents bore much of the responsibility for guarding the fortress. Today, part of the strategic-village fortress at Nakseon-dong—once used as a foundation for rebuilding amid the ruins of 4·3—has been restored as a place for historical education.","restore":"Restored features: 292 m of fortress wall, 1 temporary hamba dwelling, 5 guard posts/shelters, 1 police substation, and 4 traditional toilets (tongsi).","section":"Site Guide"},"zh":{"title":"乐善洞4·3城","sub":"Nakseon-dong 4·3 Fortress","body":"1948年11月，随着济州4·3事件不断升级，济州岛中山间地区的村庄开始遭到讨伐部队的焚毁，陆续沦为废墟。善屹里也于11月21日被大火焚毁，造成大量人员伤亡和财产损失。直到1949年春，在当局下达的重建命令下，村民们修筑了一道总长约500米的方形城墙，之后才得以返回故乡。当时，济州岛各地修筑城墙，名义上是为了阻止武装队伍袭击，实际上也成为当局有效管控居民的手段。城内的集体生活同样十分艰苦，居民只能栖身于简陋、狭窄的临时棚屋中。村民们白天要下地劳作，晚上还必须轮流站岗。由于大批年轻男性在济州4·3事件中遇难，守卫城墙的重任便落在了妇女和老年人身上。如今，为了让后人铭记这段历史，计划在乐善洞修复战略村落遗址中的部分城墙。这里曾是村民们在4·3事件造成的废墟之上重建家园的重要依托，修复后的遗址将作为历史教育基地。","restore":"复原内容：城墙292米、临时棚屋（Hamba）1栋、岗哨及棚屋5栋、警察驻在所1栋、厕所（通西）4处。","section":"设施导览"},"ja":{"title":"楽仙洞4・3城","sub":"Nakseon-dong 4·3 Fortress","body":"済州島4・3事件の真っ最中だった1948年11月以降、中山間の集落が討伐軍によって焦土化されました。ここ善屹里も11月21日に村が全焼し、多くの尊い人命が失われ、甚大な財産被害が出ました。住民たちは1949年春、当局の再建命令により、全長約500mの長方形の城を築いてようやく故郷に戻ることができました。当時、済州島全域に築かれた城は、武装隊の襲撃を遮断するという大義名分に加え、住民を効率的に統制するための手段となりました。城内での集団生活もまた過酷なものでした。住まいは粗末で狭い仮設小屋(ハンバ)がすべてでした。また、昼は畑に出て働き、夜は見張りに立たなければなりませんでした。特に若い男性たちが大勢犠牲になったため、城を守る役割は婦女子や高齢者たちの肩にかかっていました。いま、ここ楽仙洞に、4・3の廃墟を乗り越えて再建の土台とした戦略村城の一部を復元し、歴史教育の場といたします。","restore":"復元内容：城郭292m、仮設建物（ハンバ）1棟、哨所・小屋5棟、警察駐在所1棟、便所（トンシ）4棟。","section":"施設案内"}};function setLang(lang){renderSharedMenu(lang);document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);window.updateFloatingLanguage?.(lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=main[lang],u=ui[lang];siteName.textContent=u.site;siteSub.textContent=u.siteSub;title.textContent=d.title;sub.textContent=d.sub;body.textContent=d.body;restore.textContent=d.restore;sectionTitle.textContent=d.section;footerText.textContent=u.footer;renderMainContents(lang)}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');
