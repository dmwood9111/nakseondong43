  "ko": {
    "title": "중문면 대습이우영 사건",
    "sub": "Jungmun-myeon Daeseup Iwooyeong Incident",
    "body": "중문리에서는 1947년 3·1경찰발포사건에 항의하는 3·10총파업이 일어나자 3월 13일 중문지서 경찰 6명 전원이 사직원을 제출하고 지서를 떠났다. 이들을 대신해 중문지서에 배치된 응원경찰은 지역 유지들을 총파업 관계자라며 무작정 연행했다. 3월 17일 주민 1,000여 명이 중문지서 앞에서 부당하게 연행한 이들을 석방하라며 시위를 벌였다. 이에 응원경찰이 주민들에게 발포하며 다수의 사상자가 발생했다.\n\n1948년 11월 5일에는 무장대가 중문리를 대규모로 습격했다. 중문면사무소, 중문중학원을 비롯해 민가 40여 채가 불타고, 중문지서 경찰 2명을 포함해 여러 명의 사상자가 발생했다. 날이 밝자 토벌대는 습격에 대한 보복으로 불타버린 면사무소 터에서 주민 5명을 공개 총살했다. 중문리에서 벌어진 첫 번째 집단 학살이었다.\n\n이후 중문리에는 서북청년회 출신을 중심으로 구성된 응원경찰대와 군 병력이 주둔했다. 이들은 대습이우영, 중문신사 터, 도살장 터, 버리왓, 자운당 골짜기 등에서 1948년 11월부터 1949년 1월까지 하루가 멀다 하고 주민을 학살했다.\n\n대표적으로 토벌대는 대습이우영에서 1948년 11월 19일 중문면 일대 유지급 인사와 평소 서청에게 밉보인 주민을 집단 학살했다. 확인된 희생자만 15명이다. 1949년 1월 4일에는 도살장 터에서 주민 36명을 집단 학살했다. 중문리 마을 안에서 벌어진 마지막 집단 학살이었다.\n\n토벌대는 중산간 마을이 소개되기 시작하자 소개민들을 대습이우영 북쪽 큰우영팟에 모여 살도록 했다. 소개민들은 마을별로 모여 함바집을 짓고 생활해야만 했다.",
    "restore": "",

  "en": {
    "title": "Jungmun-myeon Daeseup Iwooyeong Incident",
    "sub": "중문면 대습이우영 사건",
    "body": "Following the March 10 general strike of 1947, held in protest against the March 1 police shooting incident, all six officers at the Jungmun Police Substation submitted their resignations and left on March 13. Reinforcement police sent to replace them arbitrarily detained prominent local residents, accusing them of involvement in the strike. On March 17, approximately 1,000 residents demonstrated outside the substation, demanding their release. Reinforcement police opened fire on the demonstrators, causing numerous casualties.\n\nOn November 5, 1948, an armed group launched a large-scale attack on Jungmun-ri. The Jungmun-myeon Office, Jungmun Middle School, and about 40 homes were burned, and several people were killed or injured, including two officers from the Jungmun Police Substation. At daybreak, counterinsurgency forces retaliated by publicly executing five residents at the burned-down township office site. This was the first mass killing in Jungmun-ri.\n\nSubsequently, reinforcement police composed mainly of former Northwest Youth Association members, together with military forces, were stationed in Jungmun-ri. From November 1948 to January 1949, they killed residents almost daily at Daeseup Iwooyeong, the former Jungmun Shrine, the former slaughterhouse, Beoriwat, and Jaundang Valley.\n\nOn November 19, 1948, counterinsurgency forces massacred prominent residents of the Jungmun-myeon area and others who had fallen out of favor with Northwest Youth Association members at Daeseup Iwooyeong. At least 15 victims have been confirmed. On January 4, 1949, 36 residents were massacred at the former slaughterhouse, the last mass killing within Jungmun-ri village.\n\nAs mid-mountain villages began to be evacuated, counterinsurgency forces ordered displaced residents to gather at Keun Uyeongpat, north of Daeseup Iwooyeong. The evacuees had to build temporary communal dwellings known as hamba houses and live together according to their villages of origin.",

  "zh": {
    "title": "中文面大习伊乌营事件",
    "sub": "Jungmun-myeon Daeseup Iwooyeong Incident",
    "body": "1947年，中文里发生了抗议“三一警察开枪事件”的“三一〇总罢工”。3月13日，中文警察派出所的6名警察全部提交辞呈并离开派出所。随后被派来接替他们的增援警察，以当地知名人士参与总罢工为由，肆意将其拘捕。3月17日，约1,000名居民聚集在中文警察派出所前，举行示威，要求释放遭到不当拘捕的人员。增援警察向示威居民开枪，造成多人伤亡。\n\n1948年11月5日，武装队对中文里发动了大规模袭击。中文面事务所、中文中学以及约40栋民宅被焚毁，包括中文警察派出所的2名警察在内，多人死伤。天亮后，讨伐部队为报复此次袭击，在被烧毁的面事务所旧址公开枪决了5名居民。这是中文里发生的第一次集体屠杀事件。\n\n此后，以西北青年会出身人员为主组成的增援警察队和军队驻扎在中文里。从1948年11月至1949年1月，他们几乎每天都在大习伊乌营、中文神社旧址、屠宰场旧址、波里瓦特、慈云堂山谷等地屠杀居民。\n\n其中，1948年11月19日，讨伐部队在大习伊乌营集体屠杀了中文面一带的地方知名人士，以及此前受到西北青年会成员敌视的居民。已确认的遇难者就有15人。1949年1月4日，讨伐部队又在屠宰场旧址集体屠杀了36名居民。这是中文里村落内部发生的最后一次集体屠杀事件。\n\n随着中山间地区的村庄开始实施强制疏散，讨伐部队命令疏散居民集中居住在大习伊乌营北侧的“大乌营田”。疏散居民必须按照原居住村庄分别聚集，搭建被称为“汉巴屋”的临时集体住所，共同生活。",

  "ja": {
    "title": "中文面 大スプイウヨン事件",
    "sub": "Jungmun-myeon Daeseup Iwooyeong Incident",
    "body": "中文里では、1947年の三・一警察発砲事件に抗議する三・一〇ゼネストが起こると、3月13日、中文駐在所の警察官6人全員が辞表を提出し、駐在所を去った。彼らに代わって配置された応援警察は、地域の有力者たちをゼネストの関係者だとして、無差別に連行した。3月17日、住民約1,000人が中文駐在所の前に集まり、不当に連行された人々の釈放を求めて抗議デモを行った。これに対し、応援警察が住民に向けて発砲し、多数の死傷者が発生した。\n\n1948年11月5日には、武装隊が中文里を大規模に襲撃した。中文面事務所や中文中学院をはじめ、民家約40棟が焼失し、中文駐在所の警察官2人を含む複数の死傷者が出た。夜が明けると、討伐隊は襲撃への報復として、焼失した面事務所の跡地で住民5人を公開銃殺した。これは中文里で起きた最初の集団虐殺であった。\n\nその後、中文里には西北青年会出身者を中心に編成された応援警察隊と軍部隊が駐屯した。彼らは1948年11月から1949年1月まで、大スプイウヨン、中文神社跡、屠殺場跡、ポリワッ、チャウンダン渓谷などで、ほぼ連日のように住民を虐殺した。\n\n1948年11月19日、討伐隊は大スプイウヨンで、中文面一帯の有力者や、以前から西北青年会の関係者に目をつけられていた住民を集団虐殺した。確認されている犠牲者だけでも15人に上る。1949年1月4日には、屠殺場跡で住民36人が集団虐殺された。これは中文里の集落内で起きた最後の集団虐殺であった。\n\n中山間地域の村々で住民の強制疎開が始まると、討伐隊は疎開民を大スプイウヨンの北側にあるクンウヨンパッに集めて居住させた。疎開民たちは出身の村ごとに集まり、ハンバと呼ばれる仮設の共同住居を建てて生活しなければならなかった。",
    "restore": "",
    "section": "施設案内"
  }
};function setLang(lang){renderSharedMenu(lang);document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);window.updateFloatingLanguage?.(lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=main[lang],u=ui[lang];siteName.textContent=d.title;siteSub.textContent="Jungmun-myeon Daeseup Iwooyeong Incident";title.textContent=d.title;sub.textContent=d.sub;body.textContent=d.body;restore.textContent=d.restore;restore.style.display=d.restore?"":"none";sectionTitle.textContent=d.section;footerText.textContent=u.footer;renderMainContents(lang)}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');
