padding:9px 12px;color:#222}footer{padding:24px 28px;background:#f4f4f2;border-top:1px solid #e7e7e4;font-size:11px;color:#777;text-align:center}.restore{margin-top:24px;padding:16px 18px;background:#f4f4f2;border-left:3px solid #283846;font-size:13px;line-height:1.7}.section-title{font-size:13px;letter-spacing:.08em;color:#777;margin:42px 0 12px}.contents{padding:0}.item{display:block;text-decoration:none;color:#222;padding:18px 16px;border-bottom:1px solid #e7e7e7;position:relative}.item:first-child{border-top:1px solid #e7e7e7}.num{font-size:11px;color:#888;margin-bottom:5px}.item strong{font-size:19px;letter-spacing:-.4px;overflow-wrap:anywhere;word-break:normal}.item .sub{font-size:12px;color:#777;margin-top:4px;padding-right:24px;overflow-wrap:anywhere;word-break:normal}.arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:#aaa}@media(max-width:420px){header{padding:0 18px}main{padding:30px 20px 40px}h1{font-size:32px}.nav{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.langs button{padding:9px 10px}.restore{overflow-wrap:anywhere;word-break:normal}}html[lang="zh-CN"] .body,html[lang="ja"] .body,html[lang="zh-CN"] h1,html[lang="ja"] h1,html[lang="zh-CN"] .item,html[lang="ja"] .item{word-break:break-all;overflow-wrap:anywhere}</style></head><body><div class="shell"><header><div class="brand"><span id="siteName"></span><small id="siteSub"></small></div><a id="homeBtn" class="home" href="index.html"></a></header><main><div class="eyebrow">01 / 08</div><h1 id="title"></h1><div class="en" id="sub"></div><div class="asian" id="asian"></div><div class="langs"><button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="zh">中文</button><button data-l="ja">日本語</button></div><hr class="rule"><div class="body" id="body"></div><div class="nav"><span></span><a id="tocBtn" class="list" href="index.html"></a><a id="nextBtn" href="02_hamba.html"></a></div></main><footer id="footerText"></footer></div><script>const data={"ko": {"title": "성 담", "sub": "Rampart", "asian": "城墙 | 城壁", "body": "1949년 봄, 토벌대의 진압 과정에서 폐허가 된 선흘리를 재건할 당시 주민들과 무장대 간의 연계를 차단하고 주민들을 효율적으로 감시·통제하기 위한 전략촌을 조성하면서 이곳에 성을 쌓았다. 축성 작업은 해안 마을인 함덕리 수용소 등지에서 생활하던 선흘리 주민들과 조천면 관내 주민들을 동원하여 1개월에 걸쳐 이루어졌다.\n\n성은 가로 150m, 세로 100m, 높이 3m, 폭 1m 정도의 직사각형 모양으로 총 500여 m에 달했다. 이미 많은 젊은이가 희생되었기 때문에 밤낮없이 보초를 서는 역할은 16세 이상 여성과 노약자들의 몫이었다."}, "en": {"title": "Rampart", "sub": "성 담", "asian": "城墙 | 城壁", "body": "In the spring of 1949, while Seonheul-ri was being rebuilt after being devastated during suppression operations, a strategic village was established here to sever connections between residents and armed groups and to monitor and control the population more effectively. The fortress wall was constructed over the course of one month by mobilizing Seonheul-ri residents who had been living in places such as the Hamdeok-ri detention camp, along with other residents of Jocheon-myeon.\n\nThe fortress was rectangular, measuring approximately 150 meters by 100 meters, about 3 meters high and 1 meter wide, with a total perimeter of roughly 500 meters. Because many young people had already been killed, the task of standing guard day and night fell largely to women aged 16 and older and to elderly or physically vulnerable residents."}, "zh": {"title": "城墙", "sub": "Rampart", "asian": "성 담 | 城壁", "body": "1949年春，在重建因讨伐部队镇压而成为废墟的善屹里时，为切断居民与武装队之间的联系，并对居民进行更有效的监视和控制，这里被建设为战略村，同时修筑了城墙。筑城工程历时约一个月，动员了当时生活在海岸村庄咸德里收容所等地的善屹里居民以及朝天面辖区内的居民。\n\n城墙呈长方形，长约150米、宽约100米、高约3米、墙体宽约1米，总长度约500米。由于当时许多年轻人已经遇难，昼夜站岗的任务主要由16岁以上的女性以及老弱者承担。"}, "ja": {"title": "城壁", "sub": "Rampart", "asian": "성 담 | 城墙", "body": "1949年春、討伐隊の鎮圧によって廃墟となった善屹里を再建する際、住民と武装隊とのつながりを断ち、住民を効率的に監視・統制するための戦略村が造成され、ここに城壁が築かれた。築城作業は、海岸の村である咸徳里の収容所などで暮らしていた善屹里住民と朝天面管内の住民を動員し、約1か月かけて行われた。\n\n城は長さ約150m、幅約100m、高さ約3m、壁の幅約1mの長方形で、全長は約500mに達した。すでに多くの若者が犠牲となっていたため、昼夜を問わず見張りに立つ役目は、16歳以上の女性や高齢者・体の弱い人々が担った。"}};const ui={"ko": {"home": "목록", "toc": "목록", "site": "낙선동 4·3성(城)", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "제주특별자치도 · 낙선동 4·3성"}, "en": {"home": "List", "toc": "List", "site": "Nakseon-dong 4·3 Fortress", "siteSub": "Jeju 4·3 Historical Site", "footer": "Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"}, "zh": {"home": "目录", "toc": "目录", "site": "乐善洞 4·3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "济州特别自治道 · 乐善洞 4·3城"}, "ja": {"home": "一覧", "toc": "一覧", "site": "楽善洞4・3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "済州特別自治道 · 楽善洞4・3城"}};const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所", "ja": "警察駐在所"}, "sentry": {"ko": "보초대기소", "en": "Sentry Station", "zh": "哨兵待机所", "ja": "歩哨待機所"}, "tower": {"ko": "경비망루", "en": "Watchtower", "zh": "警戒瞭望台", "ja": "警備望楼"}, "gunport": {"ko": "총안", "en": "Gun Port", "zh": "射击孔", "ja": "銃眼"}};const prevSlug=null;const nextSlug="hamba";function setLang(lang){document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=data[lang],u=ui[lang];title.textContent=d.title;sub.textContent=d.sub;asian.textContent=d.asian;body.textContent=d.body;siteName.textContent=u.site;siteSub.textContent=u.siteSub;homeBtn.textContent=u.home;tocBtn.textContent=u.toc;footerText.textContent=u.footer;const p=document.getElementById('prevBtn'),n=document.getElementById('nextBtn');if(p)p.textContent='← '+names[prevSlug][lang];if(n)n.textContent=names[nextSlug][lang]+' →'}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');</script><
