x;line-height:1.7}.section-title{font-size:13px;letter-spacing:.08em;color:#777;margin:42px 0 12px}.contents{padding:0}.item{display:block;text-decoration:none;color:#222;padding:18px 16px;border-bottom:1px solid #e7e7e7;position:relative}.item:first-child{border-top:1px solid #e7e7e7}.num{font-size:11px;color:#888;margin-bottom:5px}.item strong{font-size:19px;letter-spacing:-.4px}.item .sub{font-size:12px;color:#777;margin-top:4px;padding-right:24px}.arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:#aaa}</style></head><body><div class="shell"><header><div class="brand"><span id="siteName">낙선동 4·3성(城)</span><small id="siteSub">Nakseon-dong 4·3 Fortress</small></div></header><main><div class="eyebrow">JEJU 4·3 HISTORICAL SITE</div><h1 id="title"></h1><div class="en" id="sub"></div><div class="langs"><button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="zh">中文</button><button data-l="ja">日本語</button></div><hr class="rule"><div class="body" id="body"></div><div class="restore" id="restore"></div><div class="section-title" id="sectionTitle"></div><nav class="contents" id="contents"></nav></main><footer id="footerText"></footer></div><script>
const ui={"ko": {"home": "목록", "toc": "목차", "site": "낙선동 4·3성(城)", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "제주특별자치도 · 낙선동 4·3성"}, "en": {"home": "List", "toc": "Contents", "site": "Nakseon-dong 4·3 Fortress", "siteSub": "Jeju 4·3 Historical Site", "footer": "Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"}, "zh": {"home": "目录", "toc": "目录", "site": "乐善洞 4·3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "济州特别自治道 · 乐善洞 4·3城"}, "ja": {"home": "一覧", "toc": "目次", "site": "楽善洞4・3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "済州特別自治道 · 楽善洞4・3城"}}; const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所", "ja": "警察駐在所"}, "sentry": {"ko": "보초대기소", "en": "Sentry Station", "zh": "哨兵待机所", "ja": "歩哨待機所"}, "tower": {"ko": "경비망루", "en": "Watchtower", "zh": "警戒瞭望台", "ja": "警備望楼"}, "gunport": {"ko": "총안", "en": "Gun Port", "zh": "射击孔", "ja": "銃眼"}}; const main={"ko": {"title": "낙선동 4·3성(城)", "sub": "Nakseon-dong 4·3 Fortress", "body": "제주4.3사건이 한창이던 1948년 11월부터 중산간 마을들이 토벌군에 의해 초토화되었다. 이곳 선흘리도 11월21일 마을이 전소되어 수많은 인명희생과 재산피해를 입었다. 주민들은 1949년 봄 당국의 재건명령에 의해 길이 약 500m의 사각형 모양의 성(城)을 쌓고서야 고향에 돌아올 수 있었다.\n\n당시 제주도 전역에 쌓았던 성은 무장대습격 차단이라는 명분과 함께 주민들을 효율적으로 통제하기 위한 수단이 되었다. 성 안에서의 집단생활 또한 힘들었다. 주거지는 허름하고 좁은 가건물(함바집)이 전부였다. 또 낮에는 밭에 나가 일을 하고 밤에는 보초를 서야 했다. 특히 젊은 남자들이 대거 희생되어 성을 지키는 일은 부녀자와 노인들의 몫이었다. 이제 이곳 낙선동에 4·3의 폐허를 딛고 재건의 토대로 삼았던 전략촌성의 일부를 복원하여 역사 교육의 장으로 삼고자 한다.", "restore": "복원 내역 : 성곽 292m, 가건물(함바)-1동, 초소·막-5동, 지서-1동, 화장실(통시)-4동", "section": "시설 안내"}, "en": {"title": "Nakseon-dong 4·3 Fortress", "sub": "낙선동 4·3성(城)", "body": "From November 1948, at the height of the Jeju 4·3 Incident, villages in the mid-mountain areas were devastated by government suppression forces. Seonheul-ri was also burned down on November 21, causing numerous casualties and extensive property damage. Residents were able to return to their hometown only after building a rectangular fortress approximately 500 meters in perimeter in the spring of 1949 under an official reconstruction order.\n\nFortresses built throughout Jeju at the time were intended not only to block attacks by armed groups but also to monitor and control residents efficiently. Communal life inside the fortress was extremely difficult. The only housing consisted of crude, cramped temporary structures known as hamba houses. Residents worked in the fields during the day and stood guard at night. With many young men already killed, women and elderly residents bore much of the responsibility for guarding the fortress. Today, part of the strategic-village fortress at Nakseon-dong—once used as a foundation for rebuilding amid the ruins of 4·3—has been restored as a place for historical education.", "restore": "Restored features: 292 m of fortress wall, 1 temporary hamba dwelling, 5 guard posts/shelters, 1 police substation, and 4 traditional toilets (tongsi).", "section": "Site Guide"}, "zh": {"title": "乐善洞 4·3城", "sub": "Nakseon-dong 4·3 Fortress", "body": "自1948年11月济州4·3事件最为激烈的时期起，中山间地区的村庄在讨伐部队的镇压过程中遭到毁灭。这里的善屹里也于11月21日被焚毁，造成大量人员伤亡和财产损失。1949年春，居民按照当局的重建命令，修筑了一座周长约500米的长方形城墙，之后才得以返回故乡。\n\n当时济州岛各地修筑的城墙，除了以阻止武装队袭击为名，也成为有效监视和控制居民的手段。城内的集体生活同样十分艰苦。居住空间只有简陋狭窄的临时棚屋（Hamba）。居民白天到田里劳作，夜间还要站岗。尤其由于许多年轻男子已经遇难，守城的任务主要落在妇女和老人身上。如今，乐善洞将这座曾在4·3废墟之上作为重建基础的战略村城墙部分复原，并作为历史教育场所。", "restore": "复原内容：城墙292米、临时棚屋（Hamba）1栋、岗哨及棚屋5栋、警察驻在所1栋、厕所（通西）4处。", "section": "设施导览"}, "ja": {"title": "楽善洞4・3城", "sub": "Nakseon-dong 4·3 Fortress", "body": "済州4・3事件が激化していた1948年11月以降、中山間地域の村々は討伐隊による鎮圧の過程で壊滅した。ここ善屹里も11月21日に村が全焼し、多くの人命と財産が失われた。住民たちは1949年春、当局の再建命令により周囲約500mの長方形の城を築いて、ようやく故郷へ戻ることができた。\n\n当時、済州島各地に築かれた城は、武装隊の襲撃を防ぐという名目とともに、住民を効率的に監視・統制する手段でもあった。城内での集団生活も厳しいものだった。住居は粗末で狭い仮設建物（ハンバジプ）だけで、昼は畑で働き、夜は見張りに立たなければならなかった。特に若い男性が多数犠牲となっていたため、城を守る役目は主に女性や高齢者が担った。現在、楽善洞では、4・3の廃墟を乗り越え再建の基盤となった戦略村の城の一部を復元し、歴史教育の場としている。", "restore": "復元内容：城郭292m、仮設建物（ハンバ）1棟、哨所・小屋5棟、警察駐在所1棟、便所（トンシ）4棟。", "section": "施設案内"}}; const items=[{"href": "07_rampart.html", "slug": "rampart"}, {"href": "08_hamba.html", "slug": "hamba"}, {"href": "01_gate.html", "slug": "gate"}, {"href": "02_tongsi.html", "slug": "tongsi"}, {"href": "03_police.html", "slug": "police"}, {"href": "04_sentry.html", "slug": "sentry"}, {"href": "05_tower.html", "slug": "tower"}, {"href": "06_gunport.html", "slug": "gunport"}];
function setLang(lang){document.documentElement.lang=lang==='zh'?'zh-CN':lang;localStorage.setItem('nakseonLang',lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));const d=main[lang],u=ui[lang];siteName.textContent=u.site;siteSub.textContent=u.siteSub;title.textContent=d.title;sub.textContent=d.sub;body.textContent=d.body;restore.textContent=d.restore;sectionTitle.textContent=d.section;footerText.textContent=u.footer;contents.innerHTML=items.map((it,i)=>`<a class="item" href="${it.href}"><div class="num">${String(i+1).padStart(2,'0')}</div><strong>${names[it.slug][lang]}</strong><div class="sub">${names[it.slug].en}</div><span class="arrow">›</span></a>`).join('')}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('nakseonLang')||'ko');
</script></body></html>
