  <script>
   const data={"ko":{"title":"해자","sub":"Moat","asian":"护城河 | 堀","body":"약 500m에 달하는 성의 외곽으로 2m, 깊이 2m 정도의 도랑을 파서 해자를 만들었다. 해자 안과 바깥쪽 성벽에는 가시덤불을 놓아 무장대의 침입을 막으려 했다. 구덩이를 파는 일은 주민들에게 맡겨졌는데, 하루 한 끼도 힘들었던 당시에는 축성 작업에 버금가는 고통이었다."},"en":{"title":"Moat","sub":"해자","asian":"护城河 | 堀","body":"A ditch about 2 meters wide and 2 meters deep was dug along the roughly 500-meter outer edge of the fortress to form a moat. Thorny brambles were laid inside the moat and along the outer wall to keep the armed group from breaking in. Digging the trench fell to the villagers. At a time when even one meal a day was hard to come by, the work was nearly as grueling as building the wall itself."},"zh":{"title":"护城河","sub":"Moat","asian":"해자 | 堀","body":"在长约500米的城墙外围，挖了一条宽度和深度均约为2米的壕沟修筑了护城河。在护城河内外两侧的城墙上还放置了荆棘丛，以阻挡武装分子的入侵。挖掘壕沟的工作交给了当地的居民，而在当时连一日一餐都难以维继的岁月里，其辛苦程度堪比筑城。"},"ja":{"title":"堀","sub":"Moat","asian":"해자 | 护城河","body":"約500mに及ぶ城の外郭に、幅2m、深さ2mほどの溝を掘って堀を築いた。堀の内側と外側の城壁には茨（いばら）を置き、武装隊の侵入を防ごうとした。溝を掘る作業は住民たちに任されたが、1日1食さえままならなかった当時においては、築城作業に匹敵する苦しみであった。"}};const ui={"ko":{"home":"목록","toc":"목록","site":"낙선동 4·3성(城)","siteSub":"Nakseon-dong 4·3 Fortress","footer":"제주특별자치도 · 낙선동 4·3성"},"en":{"home":"List","toc":"List","site":"Nakseon-dong 4·3 Fortress","siteSub":"Jeju 4·3 Historical Site","footer":"Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"},"zh":{"home":"目录","toc":"目录","site":"乐善洞 4·3城","siteSub":"Nakseon-dong 4·3 Fortress","footer":"济州特别自治道 · 乐善洞 4·3城"},"ja":{"home":"一覧","toc":"一覧","site":"楽仙洞4・3城","siteSub":"Nakseon-dong 4·3 Fortress","footer":"済州特別自治道 · 楽仙洞4・3城"}};const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝統式便所）"}, "police": {"ko": "경찰지서", "en": "Police Substation", "zh": "警察驻在所
