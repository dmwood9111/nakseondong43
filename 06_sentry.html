erText"></footer></div><script>const data={"ko": {"title": "보초대기소", "sub": "Sentry Station", "asian": "哨兵待机所 | 歩哨待機所", "body": "각 초소마다 배치된 5명 중 1명이 2층 망루에 올라가 밖을 감시하는 동안, 나머지 4명이 교대를 위해 대기 하던 곳이다. 추운 겨울에는 불을 피우기도 했는데, 다른 지역에서는 화재가 발생해 이를 빌미로 주민이 경찰에게 희생 당하기도 했다."}, "en": {"title": "Sentry Station", "sub": "보초대기소", "asian": "哨兵待机所 | 歩哨待機所", "body": "Of the five people assigned to each guard post, one climbed to the second-floor watchtower to keep watch outside, while the other four waited here for their turn. During the cold winter months, they sometimes lit fires for warmth. In other areas, fires broke out, and such incidents were used as a pretext by the police, resulting in residents being killed."}, "zh": {"title": "哨兵待机所", "sub": "Sentry Station", "asian": "보초대기소", "body": "每个岗哨安排5人值守，其中1人登上二层瞭望台监视城外，其余4人在此等待轮换。寒冷的冬天，人们有时会生火取暖。在其他地区曾发生火灾，警方以此为借口，甚至造成居民被杀害的事件。"}, "ja": {"title": "歩哨待機所", "sub": "Sentry Station", "asian": "보초대기소", "body": "各哨所には5人が配置され、そのうち1人が2階の望楼に上がって外を監視している間、残りの4人は交代のためここで待機した。寒い冬には火を焚くこともあったが、他の地域では火災が発生し、それを口実に住民が警察によって犠牲となることもあった。"}};const ui={"ko": {"home": "목록", "toc": "목록", "site": "낙선동 4·3성(城)", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "제주특별자치도 · 낙선동 4·3성"}, "en": {"home": "List", "toc": "List", "site": "Nakseon-dong 4·3 Fortress", "siteSub": "Jeju 4·3 Historical Site", "footer": "Jeju Special Self-Governing Province · Nakseon-dong 4·3 Fortress"}, "zh": {"home": "目录", "toc": "目录", "site": "乐善洞 4·3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "济州特别自治道 · 乐善洞 4·3城"}, "ja": {"home": "一覧", "toc": "一覧", "site": "楽善洞4・3城", "siteSub": "Nakseon-dong 4·3 Fortress", "footer": "済州特別自治道 · 楽善洞4・3城"}};const names={"rampart": {"ko": "성 담", "en": "Rampart", "zh": "城墙", "ja": "城壁"}, "hamba": {"ko": "함바집", "en": "Hamba House", "zh": "临时棚屋（Hamba）", "ja": "ハンバジプ（仮設住居）"}, "gate": {"ko": "정문초소", "en": "Main Gate Guard Post", "zh": "正门岗哨", "ja": "正門哨所"}, "tongsi": {"ko": "통시", "en": "Tongsi (Traditional Toilet)", "zh": "通西（传统厕所）", "ja": "トンシ（伝
